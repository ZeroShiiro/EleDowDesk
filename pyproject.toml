[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eledowdesk"
version = "0.1.0"
description = "Clipboard, files, and mouse sharing between elementary OS and Windows using Wi-Fi + Bluetooth"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "EleDowDesk Contributors"}
]
keywords = ["clipboard", "file-transfer", "mouse", "wifi", "bluetooth", "elementary", "windows"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
]

dependencies = [
    "aiohttp>=3.9",
    "zeroconf>=0.131",
    "msgpack>=1.0",
    "cryptography>=42.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306",
]
linux = [
    "dbus-next>=0.2.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[project.scripts]
eledowdesk = "eledowdesk.__main__:main"
eledowdesk-daemon = "eledowdesk.daemon:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eledowdesk*"]

[tool.ruff]
line-length = 100
target-version = "py311"
